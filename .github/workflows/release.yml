name: release

# Slow path: build the installer, the portable zip and the bundled-source tarball, then publish them.
# Runs only for version tags (or a manual dry run, which builds but never publishes).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      note:
        description: "Manual dry run: builds the packages, publishes nothing"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make mingw-w64-x86_64-nsis

      # A tag is the only thing that names a release, so stop before the build when vX.Y.Z disagrees
      # with the installer's APP_VERSION or res/app.rc: the same script ci.yml runs, plus the tag.
      # Manual dry runs have no tag and skip this.
      - name: Check the tag matches the version in the sources
        if: startsWith(github.ref, 'refs/tags/v')
        shell: msys2 {0}
        run: bash scripts/check-version.sh "$GITHUB_REF_NAME"

      # A language missing a key silently falls back to English at runtime, so the tag path checks
      # the translations too: a released installer cannot be fixed by editing a file afterwards.
      - name: Every language matches lang/_template.txt
        shell: pwsh
        run: python scripts/check-lang.py

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        # 89 translation units: build them in parallel instead of one after another.
        run: make -j"$(nproc)"

      - name: Run unit tests
        shell: msys2 {0}
        run: make test

      - name: Fetch HeadsetControl binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $hc = 'third_party/headsetcontrol/headsetcontrol.exe'
          New-Item -ItemType Directory -Force (Split-Path $hc) | Out-Null
          Invoke-WebRequest 'https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-windows-x86_64.exe' -OutFile $hc
          $hash = (Get-FileHash $hc -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'e371da043710ddb8fc70af77f2ccad1cd03f8c6f49ba423e08764ad7a94a3c40') { throw "HeadsetControl checksum mismatch: $hash" }

      # NSIS writes to ..\dist relative to the script, so dist must exist (created above).
      - name: Build installer (NSIS)
        shell: msys2 {0}
        run: makensis installer/Wireless-Device-Battery-Monitor-CN.nsi

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'adhoc' }
          Copy-Item LICENSE -Destination LICENSE.txt
          Compress-Archive -Force -Path WirelessBattery.exe,third_party/headsetcontrol/headsetcontrol.exe,LICENSE.txt,installer/README.txt,installer/THIRD_PARTY_NOTICES.txt -DestinationPath "dist/Wireless-Device-Battery-Monitor-CN-$version-portable.zip"

      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      # The publish job ships whatever is in dist, so a missing or misnamed package has to fail here
      # instead of turning into a Release that only carries the source tarball.
      - name: Check release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          $want = @(
            "dist\Wireless-Device-Battery-Monitor-CN-Setup-$v.exe",
            "dist\Wireless-Device-Battery-Monitor-CN-$v-portable.zip",
            "dist\headsetcontrol-4.3.0.tar.gz")
          foreach ($f in $want) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing release artifact: $f" }
            if ((Get-Item -LiteralPath $f).Length -le 0) { throw "empty release artifact: $f" }
          }
          Write-Host "all release artifacts present"

      # A checksum file is what lets someone verify the installer they downloaded from a mirror,
      # and what a later "was this the file we built?" question can be answered from.
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          if (-not $lines) { throw 'nothing to checksum: dist is empty' }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery-CN
          path: dist/*

  # Only this job can publish, and only for version tags.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBattery-CN
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          append_body: true
          body: |
            本次发布由 CI 自动构建：安装包 `Wireless-Device-Battery-Monitor-CN-Setup-*.exe`、便携版 zip，以及随包分发的 HeadsetControl 4.3.0 对应源码。

            原项目 **Wireless Battery** 由 krisgfx（[@krisgfx9](https://github.com/krisgfx9)）编写，本项目是其简体中文本地化分支，按 GNU GPLv3 发布；原作者与上游贡献者见 [CONTRIBUTORS.md](CONTRIBUTORS.md)。上游仓库已不可访问，历史保存在本仓库与 `upstream-final` 标签中。
